<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <title>Клиент</title>
    <style>
        .indent {
            margin-left: 30px;
            margin-right: 30px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div th:replace="~{general::page-header}"></div>
<div class="container mt-5 ms-5" id="main-container">
    <div id="clientInfo">
        <h4 th:utext="'Клиент #' + ${client.id} + '<br>'"></h4>
        <span th:utext="'<b>Фамилия: </b>' + ${client.lastName} + '<br>'"></span>
        <span th:utext="'<b>Имя: </b>' + ${client.firstName} + '<br>'"></span>
        <span th:utext="'<b>Отчество: </b>' + ${client.fathersName} + '<br>'"></span>
        <span th:utext="'<b>Номер телефона: </b>' + ${client.phoneNumber} + '<br>'"></span>
        <span th:utext="'<b>e-mail: </b>' + ((${client.email} == null) ? '-' : ${client.email}) + '<br>'"></span>
        <span th:utext="'<b>Адрес: </b>' + ((${client.address} == null) ? '-' : ${client.address}) + '<br>'"></span>
    </div>

    <div class="mb-3 mt-3">
        <a class="btn btn-primary" th:href="@{/tickets(clientId=${client.id})}" >Билеты клиента</a>
    </div>

    <div>
        <a class="btn btn-secondary" th:href="@{/client_edit(clientId=${client.id})}" >Отредактировать данные клиента</a>
        <form class="d-inline ms-2" th:action="@{/client}" method="post">
            <input type="hidden" name="clientId" th:value="${client.id}">
            <button type="submit" class="btn btn-danger" id="deleteButton">Удалить клиента</button>
        </form>
    </div>
    <div id="bonusInfo" class="mt-5">
        <h5>Бонусные карты клиента:</h5>
        <table class="table table-hover table-bordered">
            <thead class="thead-dark">
            <tr>
                <th scope="col"> ID</th>
                <th scope="col"> Компания</th>
                <th scope="col"> Число бонусов</th>
            </tr>
            </thead>
            <tr th:if="${bonusList.isEmpty()}">
                <td colspan="8">Бонусные карты не найдены</td>
            </tr>
            <tbody>
            <tr th:each="bonus : ${bonusList}">
                <td>
                    <span th:text="${bonus.id}"></span>
                </td>
                <td>
                    <span th:text="${bonus.company.name}"></span>
                </td>
                <td>
                    <span th:text="${bonus.amount}"></span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.11.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
</body>
</html>
