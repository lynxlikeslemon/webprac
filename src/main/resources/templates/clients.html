<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <title>Клиенты</title>
</head>
<body>

<div th:replace="~{general::page-header}"></div>
<div class="container mt-5 ms-5 mb-5" id="main-container">
    <div id="clientSearchForm">
        <form class="row gy-2 gx-3 align-items-center" th:action="@{/clients}" method="get">
            <div class="col-auto">
                <label class="sr-only" for="firstName">Имя</label>
                <input type="text" class="form-control" id="firstName" name="firstName" placeholder="Имя" th:value="${firstName}">
            </div>
            <div class="col-auto">
                <label class="sr-only" for="lastName">Фамилия</label>
                <input type="text" class="form-control" id="lastName" name="lastName" placeholder="Фамилия" th:value="${lastName}">
            </div>
            <div class="col-auto">
                <label class="sr-only" for="fathersName">Отчество</label>
                <input type="text" class="form-control" id="fathersName" name="fathersName" placeholder="Отчество" th:value="${fathersName}">
            </div>
            <div class="col-auto">
                <label class="sr-only" for="phoneNumber">Номер телефона</label>
                <input type="text" class="form-control" id="phoneNumber" name="phoneNumber" placeholder="Номер телефона" th:value="${phoneNumber}">
            </div>
            <div class="col-auto">
                <label class="sr-only" for="companyName">Компания</label>
                <input type="text" class="form-control" id="companyName" name="companyName" placeholder="Компания" th:value="${companyName}">
            </div>
            <div class="col-auto">
                <label class="sr-only" for="flightId">Номер рейса</label>
                <input type="text" class="form-control" id="flightId" name="flightId" placeholder="Номер рейса" th:value="${flightId}">
            </div>
            <div class="col-auto">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="autoSizingCheck" name="ticketPaid" th:checked="${ticketPaid}">
                    <label class="form-check-label" for="autoSizingCheck">
                        Билет оплачен
                    </label>
                </div>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">Поиск</button>
            </div>
        </form>
    </div>
    <a class="btn btn-success mt-3" th:href="@{/client_creation}" >Зарегистрировать клиента</a>
    <div id="clientTable" class="mt-3">
        <table class="table table-hover table-bordered">
            <thead class="thead-dark">
            <tr>
                <th scope="col"> Фамилия</th>
                <th scope="col"> Имя</th>
                <th scope="col"> Отчество</th>
                <th scope="col"> Номер телефона</th>
                <th scope="col"> Страница клиента</th>
            </tr>
            </thead>
            <tr th:if="${clientList.isEmpty()}">
                <td colspan="8">Данных о клиентах не найдено</td>
            </tr>
            <tbody>
            <tr th:each="client : ${clientList}">
                <td>
                    <span th:text="${client.lastName}"></span>
                </td>
                <td>
                    <span th:text="${client.firstName}"></span>
                </td>
                <td>
                    <span th:text="${client.fathersName}"></span>
                </td>
                <td>
                    <span th:text="${client.phoneNumber}"></span>
                </td>
                <td>
                    <a th:href="@{/client(clientId=${client.id})}">Страница клиента</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.11.0/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
</div>
</body>
</html>
