<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <title>Бронирование</title>
</head>
<body>

<div th:replace="~{general::page-header}"></div>
<div class="container mt-5 ms-5 mb-5" id="main-container">
    <div id="flightInfo" class="mb-3">
        <h4 th:text="'Рейс номер ' + ${flight.id}"></h4>
        <span th:utext="'<b>Авиакомпания: </b>' + ${flight.company.name} + '<br>'"></span>
        <span th:utext="'<b>Аэропорт отправления: </b>' + ${flight.departureAirport.name} + '<br>'"></span>
        <span th:utext="'<b>Аэропорт прибытия: </b>' + ${flight.arrivalAirport.name} + '<br>'"></span>
        <span th:utext="'<b>Дата отправления: </b>' + ${flight.getDepartureLocalDate()} + '<br>'"></span>
        <span th:utext="'<b>Дата прибытия: </b>' + ${flight.getArrivalLocalDate()} + '<br>'"></span>
        <span th:utext="'<b>Время отправления: </b>' + ${flight.getDepartureLocalTime()} + '<br>'"></span>
        <span th:utext="'<b>Время прибытия: </b>' + ${flight.getArrivalLocalTime()} + '<br>'"></span>
        <span th:utext="'<b>Время в пути: </b>' + ${flight.getDuration()} + '<br>'"></span>
        <span th:utext="'<b>Стоимость билета: </b>' + ${flight.price} + '<br>'"></span>
    </div>

    <form method="get" th:action="@{/flight_booking}" class="row g-3">
        <input type="hidden" name="flightId" th:value="${flight.id}">

        <div class="col-md-8">
            <label for="clientPhoneNumber" class="form-label"><b>Номер телефона</b></label>
            <input
                   class="form-control"
                   type="tel"
                   pattern="\+\d\(\d{3}\)\d{3}-\d{2}-\d{2}"
                   id="clientPhoneNumber"
                   name="clientPhoneNumber"
                   placeholder="+7(XXX)XXX-XX-XX"
                   th:value="${param.clientPhoneNumber}"
                   required>
        </div>

        <div class="col-md-4 d-flex align-items-end">
            <button type="submit" class="btn btn-primary w-100" id="findClient">Найти клиента</button>
        </div>
    </form>

    <div th:if="${clientNotFound}" class="alert alert-warning mt-3" role="alert">
        <strong>Клиент не найден!</strong> Хотите зарегистрировать нового клиента?
        <a th:href="@{/client_creation(phoneNumber=${param.clientPhoneNumber})}"
           class="btn btn-success btn-sm ms-3" id="createClientButton">
            Создать клиента
        </a>
    </div>

    <div th:if="${client} != null" class="mt-3">
        <span th:utext="'<b>Клиент найден: </b>' + ${client.lastName} + ' ' + ${client.firstName} + ' ' + ${client.fathersName}"></span>
        <form th:action="@{/flight_booking}" method="post"  class="mt-3">
            <input type="hidden" name="flightId" th:value="${flight.id}">
            <input type="hidden" name="clientId" th:value="${client.id}">
            <div class="mt-4">
                <button type="submit" class="btn btn-success btn-lg" id="submit">
                    Забронировать билет
                </button>
            </div>

        </form>
    </div>
</div>

    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.11.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
</body>
</html>
