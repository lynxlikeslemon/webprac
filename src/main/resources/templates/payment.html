<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <title>Оплата</title>
</head>
<body>

<div th:replace="~{general::page-header}"> uhhh</div>
<div class="container mt-5 ms-5 mb-5" id="main-container">
    <div id="ticketInfo">
        <h4 th:text="'Билет #' + ${ticket.id}"></h4>
        <div id="flightInfo" class="mb-3">
            <h5 th:text="'Рейс #' + ${ticket.flight.id}"></h5>
            <span th:utext="'<b>Место отправления: </b>' + ${ticket.flight.departureAirport.city} + ' (' + ${ticket.flight.departureAirport.id} + ')'"></span><br>
            <span th:utext="'<b>Место прибытия: </b>' + ${ticket.flight.arrivalAirport.city} + ' (' + ${ticket.flight.arrivalAirport.id} + ')'"></span><br>
            <span th:utext="'<b>Время отправления: </b>' + ${ticket.flight.getDepartureLocalDate()} + ' ' + ${ticket.flight.getDepartureLocalTime()}"></span><br>
            <span th:utext="'<b>Время прибытия: </b>' + ${ticket.flight.getArrivalLocalDate()} + ' ' + ${ticket.flight.getArrivalLocalTime()}"></span><br>
            <a th:href="@{/flight(flightId=${ticket.flight.id})}">Страница рейса</a>
        </div>
    </div>

    <div id="bonusInfo">
        <table class="table table-hover table-bordered">
            <thead class="thead-dark">
            <tr>
                <th scope="col"> Компания</th>
                <th scope="col"> Число бонусов</th>
                <th scope="col"> Выбрать</th>
            </tr>
            </thead>
            <tr th:if="${bonusList.isEmpty()}">
                <td colspan="8">Бонусные карты не найдены</td>
            </tr>
            <tbody>
            <tr th:each="bonus : ${bonusList}">
                <td>
                    <span th:text="${bonus.company.name}"></span>
                </td>
                <td>
                    <span th:text="${bonus.amount}"></span>
                </td>
                <td>
                    <a th:href="@{/payment(bonusId=${bonus.id}, ticketId=${ticket.id})}" id="selectBonusButton"
                       class="btn btn-primary btn-sm">
                        Выбрать
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="(${bonus} != null)" id="bonusActive">
        <form th:action="@{/payment}" method="get">
            <input type="hidden" name="bonusId" th:value="${bonus.id}">
            <input type="hidden" name="ticketId" th:value="${ticket.id}">
            <div class="mb-3">
                <label for="bonusAmount" class="form-label">Число списываемых бонусов</label>
                <input type="number" min="0" th:max="${bonus.amount}" th:value="${bonusAmount}" name="bonusAmount" class="form-control" id="bonusAmount" required>
            </div>
            <small class="text-muted">Доступно бонусов: <span th:text="${bonus.amount}"></span></small>
            <button type="submit" class="btn btn-primary" id="confirmBonus">Подтвердить</button>
        </form>
    </div>

    <div id="price">
        <h4>
            <span th:text="'Итоговая стоимость билета: ' + (${ticket.price} - ((${bonusAmount} == null) ? 0 : ${bonusAmount}))" id="totalPrice"></span>
        </h4>
        <form th:action="@{/payment}" method="post">
            <input type="hidden" name="bonusId" th:if="${bonus} != null" th:value="${bonus.id}">
            <input type="hidden" name="ticketId" th:value="${ticket.id}">
            <input type="hidden" name="bonusAmount" th:if="${bonusAmount} != null" th:value="${bonusAmount}">
            <button type="submit" class="btn btn-primary" id="submitPayment">Оплатить</button>
        </form>

    </div>

    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.11.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
</div>
</body>
</html>
