<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <title>Билет</title>
</head>
<body>

<div th:replace="~{general::page-header}"></div>
<div class="container mt-5 ms-5 mb-5" id="main-container">
    <div id="ticketInfo">
        <h4 th:text="'Билет #' + ${ticket.id}"></h4>
        <div id="flightInfo" class="mb-3">
            <h5 th:text="'Рейс #' + ${ticket.flight.id}"></h5>
            <span th:utext="'<b>Место отправления: </b>' + ${ticket.flight.departureAirport.city} + ' (' + ${ticket.flight.departureAirport.id} + ')'"></span><br>
            <span th:utext="'<b>Место прибытия: </b>' + ${ticket.flight.arrivalAirport.city} + ' (' + ${ticket.flight.arrivalAirport.id} + ')'"></span><br>
            <span th:utext="'<b>Время отправления: </b>' + ${ticket.flight.getDepartureLocalDate()} + ' ' + ${ticket.flight.getDepartureLocalTime()}"></span><br>
            <span th:utext="'<b>Время прибытия: </b>' + ${ticket.flight.getArrivalLocalDate()} + ' ' + ${ticket.flight.getArrivalLocalTime()}"></span><br>
            <a th:href="@{/flight(flightId=${ticket.flight.id})}" id="flightPageLink">Страница рейса</a>
        </div>

        <h4 th:text="'Клиент #' + ${ticket.client.id}"></h4>
        <div id="clientInfo" class="mb-3">
            <span th:utext="'<b>ФИО: </b>' + ${ticket.client.lastName} + ' ' + ${ticket.client.firstName} + ' ' + ${ticket.client.fathersName}"></span><br>
            <span th:utext="'<b>Номер телефона: </b>' + ${ticket.client.phoneNumber}"></span><br>
            <a th:href="@{/client(clientId=${ticket.client.id})}" id="clientPageLink">Страница клиента</a>
        </div>
        <div id="paymentInfo" class="mb-3">
            <span th:utext="'<b>Время бронирования: </b>' + ${ticket.getBookingLocalDate()} + ' ' + ${ticket.getBookingLocalTime()}"></span><br>
            <span th:if="${ticket.isPaidFor} == true" th:utext="'<b>Время оплаты: </b>' + ${ticket.getPaymentLocalDate()} + ' ' + ${ticket.getPaymentLocalTime() + '<br>'}"></span>
        </div>
    </div>

    <div th:if="${ticket.isPaidFor} == false" class="mb-3">
        <a class="btn btn-success" th:href="@{/payment(ticketId=${ticket.id})}" id="paymentButton">Оплатить билет</a>
    </div>
    <form class="" th:action="@{/ticket}" method="post">
        <input type="hidden" name="ticketId" th:value="${ticket.id}">
        <button type="submit" class="btn btn-danger">Отменить заказ</button>
    </form>

    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.11.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
</div>
</body>
</html>
