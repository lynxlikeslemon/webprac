<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <title>Билеты</title>
</head>
<body>
<div th:replace="~{general::page-header}"></div>

<div class="container mt-5 ms-5 mb-5" id="main-container">
<div id="clientInfo" class="mb-3">
    <h4 th:text="'Билеты клиента #' + ${client.id}"></h4>
    <span th:utext="'<b>ФИО: </b>' + ${client.lastName} + ' ' + ${client.firstName} + ' ' + ${client.fathersName}"></span><br>
    <span th:utext="'<b>Номер телефона: </b>' + ${client.phoneNumber}"></span>
</div>

<form class="row gy-2 gx-3 align-items-center" th:action="@{/tickets}" method="get">
    <input type="hidden" name="clientId" th:value="${client.id}">
    <div class="col-auto">
        <label class="sr-only" for="departureDate">Дата отправления</label>
        <input type="date" class="form-control" id="departureDate" name="departureDate" placeholder="Дата отправления" th:value="${departureDate}">
    </div>
    <div class="col-auto">
        <label class="sr-only" for="departureCity">Город отправления</label>
        <input type="text" class="form-control" id="departureCity" name="departureCity" placeholder="Город отправления" th:value="${departureCity}">
    </div>
    <div class="col-auto">
        <label class="sr-only" for="arrivalCity">Город прибытия</label>
        <input type="text" class="form-control" id="arrivalCity" name="arrivalCity" placeholder="Город прибытия" th:value="${arrivalCity}">
    </div>
    <div class="col-auto">
        <div class="form-check">
            <input class="form-check-input" type="checkbox" id="autoSizingCheck" name="ticketPaid" th:checked="${ticketPaid}">
            <label class="form-check-label" for="autoSizingCheck">
                Билет оплачен
            </label>
        </div>
    </div>
    <div class="col-auto">
        <button type="submit" class="btn btn-primary">Поиск</button>
    </div>
</form>


<table class="table table-hover table-bordered" id="ticketTable">
    <thead class="thead-dark">
    <tr>
        <th scope="col"> Место отправления</th>
        <th scope="col"> Место прибытия</th>
        <th scope="col"> Время вылета</th>
        <th scope="col"> Время прилёта</th>
        <th scope="col"> Статус</th>
        <th scope="col"> Страница билета</th>
    </tr>
    </thead>
    <tr th:if="${ticketList.isEmpty()}">
        <td colspan="8">Данных о билетах не найдено</td>
    </tr>
    <tbody>
    <tr th:each="ticket : ${ticketList}">
        <td>
            <span th:text="${ticket.flight.departureAirport.city} + ' (' + ${ticket.flight.departureAirport.id} + ')'"></span>
        </td>
        <td>
            <span th:text="${ticket.flight.arrivalAirport.city} + ' (' + ${ticket.flight.arrivalAirport.id} + ')'"></span>
        </td>
        <td>
            <span th:text="${ticket.flight.getDepartureLocalDate()} + ' ' + ${ticket.flight.getDepartureLocalTime()}"></span>
        </td>
        <td>
            <span th:text="${ticket.flight.getArrivalLocalDate()} + ' ' + ${ticket.flight.getArrivalLocalTime()}"></span>
        </td>
        <td>
            <span th:text="(${ticket.isPaidFor} == true) ? 'Оплачен' : 'Не оплачен'"></span>
        </td>
        <td>
            <a th:href="@{/ticket(ticketId=${ticket.id})}">Страница билета</a>
        </td>
    </tr>
    </tbody>
</table>
</div>

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.11.0/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
</body>
</html>
